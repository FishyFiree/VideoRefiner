[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videorefiner"
version = "0.2.0"
description = "AI 视频插帧 + 超分工具：输入任意帧率/分辨率视频，输出更高帧率且/或更高分辨率，只做 AI 生成/重建不改语义"
requires-python = ">=3.11"
dependencies = [
    "av>=12",
    "numpy>=1.24",
    "torch>=2.0",
    "PySide6>=6.6",
]

[project.scripts]
videorefiner = "videorefiner.cli:main"

[tool.setuptools.packages.find]
include = ["videorefiner*"]
